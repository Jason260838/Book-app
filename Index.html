<!DOCTYPE html>
<html>
<head>
    <title>Bookstore App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .book {
            background: white;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background: #0056b3;
        }

        #cart {
            margin-top: 20px;
            background: white;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<h1>📚 My Bookstore</h1>

<div id="books"></div>

<div id="cart">
    <h2>Shopping Cart</h2>
    <ul id="cartItems"></ul>
</div>

<script>
const books = [
    { id: 1, title: "The Great Gatsby", price: 10 },
    { id: 2, title: "Harry Potter", price: 15 },
    { id: 3, title: "The Alchemist", price: 12 }
];

const cart = [];

function displayBooks() {
    const bookContainer = document.getElementById("books");

    books.forEach(book => {
        const div = document.createElement("div");
        div.className = "book";
        div.innerHTML = `
            <h3>${book.title}</h3>
            <p>Price: $${book.price}</p>
            <button onclick="addToCart(${book.id})">
                Add to Cart
            </button>
        `;
        bookContainer.appendChild(div);
    });
}

function addToCart(id) {
    const book = books.find(b => b.id === id);
    cart.push(book);

    const cartItems = document.getElementById("cartItems");
    const li = document.createElement("li");
    li.textContent = `${book.title} - $${book.price}`;
    cartItems.appendChild(li);
}

displayBooks();
</script>

</body>
</html>
